name: Release Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    name: calculate release version
    runs-on: ubuntu-22.04

    outputs:
      new-tag: ${{ steps.bump.outputs.new-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Calculate release version
        id: bump
        uses: faisal-memon/pr-label-semver@v0
        with:
          github-token: ${{ github.token }}
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}

  integration-test:
    name: integration test (linux)
    runs-on: ubuntu-22.04
    needs: version

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Run integration tests
        run: make integration-test-verbose

  build:
    name: build (linux)
    runs-on: ubuntu-22.04
    needs: [version, integration-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build artifact (x86_64)
        run: make build
      - name: Compress artifact (x86_64)
        run: tar -czvf spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-x86_64.tar.gz spiffe-helper
      - name: Build artifact (arm64)
        run: GOARCH=arm64 make build
      - name: Compress artifact (arm64)
        run: tar -czvf spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-arm64.tar.gz spiffe-helper
      - name: Build docker artifact
        run: make docker-build
      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: spiffe-helper
          path: |
            spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-x86_64.tar.gz
            spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-arm64.tar.gz
            spiffe-helper-image.tar

  release:
    runs-on: ubuntu-22.04
    needs: [version, build]

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download archived artifact
        uses: actions/download-artifact@v8
        with:
          name: spiffe-helper
          path: .
      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main
      - name: Push docker image
        run: ./.github/workflows/scripts/push-images.sh ${{ needs.version.outputs.new-tag }}
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Create the release using the version number as the title
        run: >-
          gh release create "${{ needs.version.outputs.new-tag }}"
          ./spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-x86_64.tar.gz
          ./spiffe-helper_${{ needs.version.outputs.new-tag }}_Linux-arm64.tar.gz
          --title "${{ needs.version.outputs.new-tag }}"
          --generate-notes
